[package]
name = "rustcraft-redefined"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "rustcraft_redefined"

[[bin]]
name = "RustcraftRedefined"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
