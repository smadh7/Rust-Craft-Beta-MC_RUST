[package]
name = "rustcraft-redefined"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
build = "build.rs"
description = "An unofficial, clean-room voxel sandbox written in Rust with a C++ native core."
license = "MIT"
publish = false

[lib]
name = "rustcraft"
path = "src/lib.rs"

[[bin]]
name = "RustcraftRedefined"
path = "src/main.rs"

# No third-party crates: the windowing, OpenGL, WebGL, NBT, zlib and region code are all in-tree.
[dependencies]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 4
panic = "abort"
strip = true
